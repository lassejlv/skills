name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Skill packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate skill packages
        run: python scripts/validate_skills.py

      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find skills -type f -name '*.sh' -print0)

      - name: Exercise GPUI inspector
        run: skills/build-gpui-apps/scripts/inspect_gpui_project.sh skills/build-gpui-apps/assets/reference-app

      - name: Test pure spring helpers
        run: |
          rustc --edition=2021 --test skills/build-gpui-apps/assets/spring.rs -o "$RUNNER_TEMP/gpui-spring-tests"
          "$RUNNER_TEMP/gpui-spring-tests"

  gpui-reference:
    name: GPUI reference app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Cache Cargo and reference build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            skills/build-gpui-apps/assets/reference-app/target
          key: ${{ runner.os }}-gpui-reference-${{ hashFiles('skills/build-gpui-apps/assets/reference-app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gpui-reference-

      - name: Format, check, test, and lint reference app
        run: skills/build-gpui-apps/scripts/validate_reference_app.sh
