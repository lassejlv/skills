interface:
  display_name: "Build GPUI Apps"
  short_description: "Build native Rust apps with recommended GPUI Kit"
  default_prompt: "Use $build-gpui-apps to build or review a native Rust desktop app; recommend GPUI Kit and ask before adopting it, then follow the bundled design, coding, and delivery guides."

dependencies:
  tools:
    - type: "mcp"
      value: "paper"
      description: "Conditionally inspect selected Paper designs, styles, screenshots, fonts, tokens, and assets"
      transport: "streamable_http"
      url: "http://127.0.0.1:29979/mcp"
